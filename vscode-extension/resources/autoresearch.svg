<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<title id="title">Agent-led exploration, evidence-led review</title><desc id="desc">Agent proposals enter a bounded queue. Completed evidence proceeds to review and human confirmation; failures and recorded-only proposals are retained without being counted as completed analyses.</desc>
