<g fill="none" stroke="#718f9f" stroke-width="1.7" marker-end="url(#a)"><path d="M183 185h30"/><path d="M378 185h32V67h38"/><path d="M410 185h38"/><path d="M410 185v117h38"/><path d="M593 67h30"/><path d="M667 96v45"/></g>
<g stroke="#9cb7c6" stroke-width="1.2" fill="#fff"><rect x="12" y="153" width="171" height="64" rx="8"/><rect x="213" y="153" width="165" height="64" rx="8" fill="#eaf2f5"/><rect x="448" y="38" width="145" height="58" rx="8"/><rect x="448" y="156" width="145" height="58" rx="8"/><rect x="448" y="273" width="145" height="58" rx="8"/><rect x="623" y="38" width="88" height="58" rx="8"/><rect x="618" y="141" width="98" height="82" rx="8" stroke="#007f73"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#12283b" text-anchor="middle" font-size="19"><text x="98" y="192">Agent proposals</text><text x="295" y="192">Bounded queue</text><text x="520" y="74">Completed</text><text x="520" y="192">Failed</text><text x="520" y="309">Recorded only</text><text x="667" y="74" font-size="17">Review</text><text x="667" y="174" fill="#007f73" font-size="17">Human</text><text x="667" y="199" fill="#007f73" font-size="17">confirmation</text></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#526777" text-anchor="middle" font-size="15"><text x="295" y="244">Fixed budget + design hashes</text><text x="520" y="239">Failure evidence retained</text><text x="520" y="356">No fabricated execution</text></g>
</svg>
